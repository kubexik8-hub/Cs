<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS2 OBS Widget</title>
<style>
:root{--accent:#a855f7;--accent-soft:#a855f722;--text:#f7f1ff;--muted:#9b90aa;--green:#5ced89;--red:#ff747e;--yellow:#ffd75d;--card:#161020;--border:#ffffff14}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;overflow:hidden;background:transparent;color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}.shell{width:100%;padding:14px;border-radius:15px;border:1px solid var(--border);background:transparent}.shell.solid{background:linear-gradient(140deg,#1b1427f5,#100b18f5);box-shadow:0 10px 35px #0004}.widget{width:100%;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.identity{min-width:0}.name{font-size:22px;font-weight:1000;letter-spacing:-.6px;line-height:1.1;overflow-wrap:anywhere}.sub{margin-top:5px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}.mark{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-size:9px;font-weight:1000;letter-spacing:.7px;white-space:nowrap}.dot{width:5px;height:5px;border-radius:50%;background:var(--green)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:12px 0}.stat{min-width:0;padding:10px;border-radius:10px;border:1px solid var(--border);background:#ffffff08}.stat-label{font-size:8px;font-weight:900;letter-spacing:.9px;color:var(--muted);text-transform:uppercase}.stat-value{margin-top:5px;font-size:19px;line-height:1.1;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat-caption{margin-top:4px;color:#83778f;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.form{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:11px}.form-label{margin-right:4px;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.9px;text-transform:uppercase}.pill{width:25px;height:25px;display:grid;place-items:center;border-radius:7px;font-size:10px;font-weight:1000;border:1px solid transparent}.pill.w{background:#5ced8918;color:var(--green);border-color:#5ced8924}.pill.l{background:#ff747e18;color:var(--red);border-color:#ff747e24}.pill.t{background:#ffd75d18;color:var(--yellow);border-color:#ffd75d24}.pill.q{background:#ffffff0a;color:#a9a0b5;border-color:#ffffff10}.history{margin-top:12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.match{min-width:0;padding:9px;border:1px solid var(--border);border-radius:10px;background:#ffffff08}.match-top{display:flex;align-items:center;justify-content:space-between;gap:5px}.result{font-size:14px;font-weight:1000}.result.w{color:var(--green)}.result.l{color:var(--red)}.result.t{color:var(--yellow)}.map{font-size:8px;color:#a39ab1;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{margin-top:6px;font-size:12px;font-weight:1000}.details{margin-top:5px;color:#aaa0b8;font-size:8px;line-height:1.5;overflow-wrap:anywhere}.source{display:inline-block;margin-top:4px;color:var(--accent);font-size:8px;font-weight:900}.empty{padding:16px;border-radius:10px;border:1px solid var(--border);background:#ffffff06;color:#b5a9c4;font-size:11px;line-height:1.6;white-space:pre-wrap}.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;color:#786d87;font-size:8px}.foot a{color:var(--accent);text-decoration:none;font-weight:900}.history-only .history{margin-top:0}.history-only .head{margin-bottom:11px}.preview-tag{position:fixed;right:6px;top:4px;color:#a99bb6;font-size:7px;letter-spacing:1px;font-weight:1000}
@media(max-width:700px){.history{grid-template-columns:repeat(2,minmax(0,1fr))}.name{font-size:19px}.stat-value{font-size:16px}.shell{padding:11px}}
</style>
</head>
<body>
<div id="root" class="shell"><div class="empty">Ładowanie widgetu…</div></div>
<script>
(function(){
const params=new URLSearchParams(location.search);
const wantedSteam=params.get("steam64_id")||"76561199436045966";
const layout=["stats","full","history"].includes(params.get("layout"))?params.get("layout"):"stats";
const background=params.get("bg")==="solid"?"solid":"transparent";
const limit=Math.max(1,Math.min(30,Number(params.get("limit")||10)));
const colors=["#a855f7","#f84982","#22d3ee","#22c55e","#f59e0b"];
const accent=params.get("accent");
const safeAccent=colors.includes(accent)?accent:"#a855f7";
const validShows=["kd","winrate","avg","rating","form","date"];
const show=new Set((params.get("show")||"kd,winrate,avg,rating,form,date").split(",").filter(x=>validShows.includes(x)));
const preview=params.get("preview")==="1";
const root=document.getElementById("root");
document.documentElement.style.setProperty("--accent",safeAccent);
document.documentElement.style.setProperty("--accent-soft",safeAccent+"22");
root.classList.toggle("solid",background==="solid");
if(layout==="history")root.classList.add("history-only");
const esc=v=>String(v==null?"":v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
function sourceName(v){const s=String(v||"unknown").toLowerCase();const labels={matchmaking:"Premier / MM",matchmaking_competitive:"Competitive",faceit:"FACEIT",renown:"Renown"};return labels[s]||s.replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase())}
function shortSource(v){const s=String(v||"").toLowerCase();return({matchmaking:"MM",matchmaking_competitive:"COMP",faceit:"FACEIT",renown:"REN"})[s]||sourceName(s).split(" ").map(x=>x[0]).join("").slice(0,5).toUpperCase()}
function outcomeClass(v){return v==="W"?"w":v==="L"?"l":v==="T"?"t":"q"}
function dateLabel(v){if(!v)return"—";const d=new Date(v);return Number.isNaN(d.getTime())?"—":d.toLocaleDateString("pl-PL",{day:"2-digit",month:"2-digit"})}
function normalize(snapshot){
if(String(snapshot.steam64_id||"")!==wantedSteam)return {mismatch:true,profile:snapshot.profile||{},matches:[]};
const all=Array.isArray(snapshot.matches)?snapshot.matches:[];
const matches=all.map(m=>{
const p=(Array.isArray(m.stats)?m.stats:[]).find(x=>String(x.steam64_id||"")===wantedSteam);
if(!p)return null;
const teams=Array.isArray(m.team_scores)?m.team_scores:[];
const teamNo=Number(p.initial_team_number);
const own=teams.find(x=>Number(x.team_number)===teamNo);
const opp=teams.find(x=>Number(x.team_number)!==teamNo);
let a=own?Number(own.score):p.rounds_won==null?null:Number(p.rounds_won);
let b=opp?Number(opp.score):p.rounds_lost==null?null:Number(p.rounds_lost);
let result="—";
const out=String(m.outcome||m.result||"").toLowerCase();
if(["win","won","w"].includes(out))result="W";else if(["loss","lost","l"].includes(out))result="L";else if(["tie","draw","t"].includes(out))result="T";else if(a!==null&&b!==null)result=a>b?"W":a<b?"L":"T";
return{id:String(m.id||""),source:String(m.data_source||"unknown"),map:String(m.map_name||"Unknown").replace(/^de_/,"").toUpperCase(),date:m.finished_at||"",score:a===null?"—":a+":"+b,result,k:Number(p.total_kills||0),d:Number(p.total_deaths||0),a:Number(p.total_assists||0),hs:Number(p.total_hs_kills||0),kd:p.kd_ratio==null?null:Number(p.kd_ratio),rating:p.leetify_rating==null?null:Number(p.leetify_rating)};
}).filter(Boolean).sort((a,b)=>(new Date(b.date).getTime()||0)-(new Date(a.date).getTime()||0));
return{mismatch:false,profile:snapshot.profile||{},matches,updated:snapshot.updated_at||""};
}
function statsFor(matches){
const wins=matches.filter(m=>m.result==="W").length,losses=matches.filter(m=>m.result==="L").length,decided=wins+losses;
const kills=matches.reduce((s,m)=>s+m.k,0),deaths=matches.reduce((s,m)=>s+m.d,0);
const ratings=matches.map(m=>m.rating).filter(n=>Number.isFinite(n));
return{kd:deaths?kills/deaths:kills,winrate:decided?wins/decided*100:0,avg:matches.length?kills/matches.length:0,rating:ratings.length?ratings.reduce((s,n)=>s+n,0)/ratings.length:null,wins,losses};
}
function formStrip(matches){if(!matches.length)return"";return'<div class="form"><span class="form-label">OSTATNIE</span>'+matches.slice(0,10).map(m=>'<span class="pill '+outcomeClass(m.result)+'">'+esc(m.result||"—")+'</span>').join("")+'</div>'}
function metrics(s,matches){
const items=[];
if(show.has("kd"))items.push(["K/D",s.kd.toFixed(2),"ogółem w historii"]);
if(show.has("winrate"))items.push(["WIN RATE",s.winrate.toFixed(1)+"%","z wygranych / przegranych"]);
if(show.has("avg"))items.push(["ŚR. KILLS",s.avg.toFixed(1),"zapisane mecze"]);
if(show.has("rating"))items.push(["LEETIFY",s.rating===null?"—":s.rating.toFixed(2),"średnia z dostępnych ocen"]);
return items.length?'<div class="stats">'+items.map(([l,v,c])=>'<div class="stat"><div class="stat-label">'+l+'</div><div class="stat-value">'+esc(v)+'</div><div class="stat-caption">'+esc(c)+'</div></div>').join("")+'</div>':"";
}
function cards(matches){
if(!matches.length)return'<div class="empty">Brak meczów w pliku historii. Uruchom pierwszą synchronizację Leetify w GitHub Actions.</div>';
return'<div class="history">'+matches.map(m=>'<article class="match"><div class="match-top"><span class="result '+outcomeClass(m.result)+'">'+esc(m.result)+'</span><span class="map">'+esc(m.map)+'</span></div><div class="score">'+esc(m.score)+'</div><div class="details">K '+m.k+' · D '+m.d+' · A '+m.a+(show.has("kd")&&m.kd!==null?' · K/D '+m.kd.toFixed(2):"")+(show.has("date")?'<br>'+dateLabel(m.date):"")+'</div><div class="source">'+esc(sourceName(m.source))+'</div></article>').join("")+'</div>';
}
function render(snapshot){
const normalized=normalize(snapshot);
if(normalized.mismatch){root.innerHTML='<div class="empty">Ten link jest skonfigurowany dla Steam64 ID '+esc(wantedSteam)+', ale opublikowana historia należy do innego profilu ('+esc(snapshot.steam64_id)+'). Zmień STEAM64_ID w workflow GitHub i uruchom synchronizację, aby wygenerować widget dla innego gracza.</div>';return}
const matches=normalized.matches;
const recent=matches.slice(0,limit);
const stats=statsFor(matches);
const profile=normalized.profile;
const name=profile.name||"{twój nick}";
const head='<div class="head"><div class="identity"><div class="name">'+esc(name)+'</div><div class="sub">CS2 · LEETIFY MATCH STATS</div></div><div class="mark"><span class="dot"></span> MATCH DATA</div></div>';
const metricRow=metrics(stats,matches);
const form=show.has("form")?formStrip(matches):"";
const history=cards(recent);
let body="";
if(layout==="stats"){
body=head+metricRow+form;
}else if(layout==="history"){
body=head+history;
}else{
body=head+metricRow+form+history;
}
const footer='<div class="foot"><span>'+matches.length+' dostępnych meczów · '+(normalized.updated?new Date(normalized.updated).toLocaleDateString("pl-PL"):"")+'</span><a href="https://leetify.com/" target="_blank" rel="noopener noreferrer">DATA PROVIDED BY LEETIFY</a></div>';
root.innerHTML=body+footer;
}
async function load(){
if(preview){
const demo=[
{result:"W",map:"MIRAGE",score:"13:8",source:"matchmaking",k:22,d:14,a:5,kd:1.57,rating:7.8,date:"2026-10-24T20:15:00Z"},
{result:"W",map:"NUKE",score:"13:10",source:"matchmaking_competitive",k:19,d:16,a:4,kd:1.19,rating:6.3,date:"2026-10-23T18:12:00Z"},
{result:"L",map:"INFERNO",score:"9:13",source:"faceit",k:16,d:18,a:3,kd:.89,rating:5.7,date:"2026-10-22T21:30:00Z"},
{result:"W",map:"DUST2",score:"13:7",source:"matchmaking",k:24,d:12,a:7,kd:2,rating:8.1,date:"2026-10-21T16:30:00Z"},
{result:"T",map:"ANCIENT",score:"12:12",source:"matchmaking_competitive",k:20,d:20,a:6,kd:1,rating:6.9,date:"2026-10-20T15:10:00Z"}
];
const m=demo.map((x,i)=>({...x,id:String(i)}));
render({steam64_id:wantedSteam,updated_at:new Date().toISOString(),profile:{name:"kubexik"},matches:m.map(x=>({id:x.id,data_source:x.source,map_name:x.map.toLowerCase(),finished_at:x.date,team_scores:[{team_number:2,score:Number(x.score.split(":")[0])},{team_number:3,score:Number(x.score.split(":")[1])}],stats:[{steam64_id:wantedSteam,name:"kubexik",initial_team_number:2,total_kills:x.k,total_deaths:x.d,total_assists:x.a,kd_ratio:x.kd,leetify_rating:x.rating,rounds_won:null,rounds_lost:null}]}))});
const tag=document.createElement("div");tag.className="preview-tag";tag.textContent="PREVIEW";document.body.appendChild(tag);return;
}
try{
let snapshot=null;
let lastError=null;
for(const path of ["./matches.json","./docs/matches.json"]){
try{
const response=await fetch(path+"?ts="+Date.now(),{cache:"no-store"});
if(!response.ok)throw new Error("HTTP "+response.status+" dla "+path);
snapshot=await response.json();
break;
}catch(error){lastError=error}
}
if(!snapshot)throw lastError||new Error("Brak pliku historii");
render(snapshot);
}catch(error){root.innerHTML='<div class="empty">Nie można wczytać historii Leetify.\\n'+esc(error.message||"Błąd połączenia")+'</div>'}
}
load();
})();
</script>
</body></html>
