name: Refresh CS2 history from Leetify

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Leetify history snapshot
        env:
          STEAM64_ID: "76561199436045966"
          LEETIFY_API_KEY: ${{ secrets.LEETIFY_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const steamId = String(process.env.STEAM64_ID || "").trim();
          const apiKey = String(process.env.LEETIFY_API_KEY || "").trim();
          const outputPath = "docs/matches.json";

          if (!/^\d{17}$/.test(steamId)) {
            throw new Error("STEAM64_ID must contain exactly 17 digits.");
          }

          async function get(path) {
            const headers = { Accept: "application/json" };
            if (apiKey) headers.Authorization = "Bearer " + apiKey;

            const response = await fetch("https://api-public.cs-prod.leetify.com" + path, {
              headers,
              signal: AbortSignal.timeout(20000)
            });

            let body;
            try {
              body = await response.json();
            } catch {
              throw new Error("Leetify returned a response that is not valid JSON.");
            }

            if (!response.ok) {
              throw new Error("Leetify API returned HTTP " + response.status + " for " + path);
            }

            return body;
          }

          function listOfMatches(body) {
            if (Array.isArray(body)) return body;
            if (Array.isArray(body && body.matches)) return body.matches;
            if (Array.isArray(body && body.data)) return body.data;
            return [];
          }

          async function main() {
            const query = new URLSearchParams({ steam64_id: steamId }).toString();
            console.log("Fetching Leetify profile and full available match history.");

            const [profile, historyBody] = await Promise.all([
              get("/v3/profile?" + query),
              get("/v3/profile/matches?" + query)
            ]);

            const rawMatches = listOfMatches(historyBody);
            const matches = rawMatches.map(match => {
              const player = (Array.isArray(match.stats) ? match.stats : [])
                .find(item => String(item && item.steam64_id || "") === steamId);

              if (!player) return null;

              return {
                id: String(match.id || ""),
                data_source: String(match.data_source || "unknown"),
                finished_at: match.finished_at || "",
                map_name: match.map_name || "Unknown map",
                team_scores: Array.isArray(match.team_scores)
                  ? match.team_scores.map(team => ({
                      team_number: Number(team.team_number),
                      score: Number(team.score)
                    }))
                  : [],
                stats: [{
                  steam64_id: steamId,
                  name: String(player.name || profile.name || ""),
                  initial_team_number: Number(player.initial_team_number || 0),
                  rounds_won: player.rounds_won == null ? null : Number(player.rounds_won),
                  rounds_lost: player.rounds_lost == null ? null : Number(player.rounds_lost),
                  total_kills: Number(player.total_kills || 0),
                  total_deaths: Number(player.total_deaths || 0),
                  total_assists: Number(player.total_assists || 0),
                  total_hs_kills: Number(player.total_hs_kills || 0),
                  kd_ratio: player.kd_ratio == null ? null : Number(player.kd_ratio),
                  leetify_rating: player.leetify_rating == null ? null : Number(player.leetify_rating)
                }]
              };
            }).filter(Boolean).sort((a, b) =>
              (new Date(b.finished_at).getTime() || 0) - (new Date(a.finished_at).getTime() || 0)
            );

            const snapshot = {
              steam64_id: steamId,
              updated_at: new Date().toISOString(),
              profile: {
                name: String(profile.name || ""),
                privacy_mode: String(profile.privacy_mode || "unknown"),
                total_matches: Number(profile.total_matches || matches.length),
                winrate: profile.winrate == null ? null : Number(profile.winrate),
                ranks: profile.ranks || {},
                rating: profile.rating || {},
                stats: profile.stats || {}
              },
              matches,
              historyError: matches.length ? "" :
                "Leetify API returned no processed matches for this account. Check your Leetify profile and match-tracking settings."
            };

            fs.writeFileSync(outputPath, JSON.stringify(snapshot, null, 2) + "\n", "utf8");
            console.log("Saved " + matches.length + " matches from all available sources to " + outputPath + ".");
          }

          main().catch(error => {
            console.error(error && error.stack ? error.stack : error);
            process.exit(1);
          });
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
